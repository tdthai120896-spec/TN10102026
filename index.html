<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mừng Thôi Nôi Bé Huỳnh Lê Khả Hân • 1st Birthday</title>

  <!-- Google Fonts Chuẩn Tiếng Việt không lỗi dấu -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            theme: {
              sage: '#4E7259',
              'sage-light': '#E2EDE5',
              gold: '#B8923F',
              'gold-light': '#FAF5E8',
              'gold-border': '#E4D5B2',
              text: '#1C2E22',
              secondary: '#55695C',
            }
          },
          fontFamily: {
            sans: ['"Be Vietnam Pro"', '-apple-system', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            cursive: ['"Great Vibes"', 'cursive']
          },
          borderRadius: {
            'apple-card': '24px',
            'apple-banner': '28px'
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #1C2E22;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      background-color: #EBF2EC; /* Màu đệm nhẹ khi đang tải ảnh */
    }

    /* Kính mờ siêu thực cho Card - Phản chiếu màu nền phía sau */
    .glass-warm {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 20px 45px rgba(28, 46, 34, 0.07);
    }

    /* Hiệu ứng Scroll mờ -> rõ */
    .reveal-item {
      opacity: 0;
      filter: blur(8px);
      transform: translateY(28px);
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, filter, transform;
    }
    .reveal-item.is-visible {
      opacity: 1;
      filter: blur(0);
      transform: translateY(0);
    }

    /* Đĩa nhạc xoay tròn */
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-music {
      animation: spin-slow 7s linear infinite;
    }
  </style>
</head>
<body class="relative selection:bg-theme-sage selection:text-white">

  <!-- ========================================================
       ẢNH HERO LÀM NỀN TOÀN BỘ WEB (BLUR CỰC MỊN & SẮC NÉT TỰ NHIÊN)
       ======================================================== -->
  <div class="fixed inset-0 -z-30 overflow-hidden pointer-events-none select-none">
    <img 
      src="/assets/photo_hero.jpg" 
      alt="Hero Ambient Background" 
      class="w-full h-full object-cover scale-125 filter blur-[36px] md:blur-[48px] brightness-[1.02] saturate-[1.35]" 
    />
    <!-- Lớp phủ kính sáng mỏng giúp giữ trọn vẹn tone xanh mint & vàng gỗ của ảnh mà đọc chữ vẫn cực kỳ rõ -->
    <div class="absolute inset-0 bg-white/45 backdrop-blur-[4px]"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-white/20 via-transparent to-white/30"></div>
  </div>

  <!-- Audio phát nhạc ẩn -->
  <audio id="bgMusic" src="/music.mp3" loop preload="auto"></audio>

  <!-- Nút Bật/Tắt Nhạc nổi góc phải -->
  <div class="fixed bottom-6 right-6 z-50">
    <button id="musicToggleBtn" onclick="window.toggleMusic()" class="glass-warm px-3.5 py-3 rounded-full flex items-center gap-2.5 shadow-xl hover:scale-105 active:scale-95 transition-all border border-theme-gold-border group">
      <div id="musicIconWrapper" class="w-8 h-8 rounded-full bg-theme-sage text-white flex items-center justify-center">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>
      <span id="musicStatusText" class="text-xs font-semibold text-theme-text pr-1 hidden sm:inline-block">Phát Nhạc</span>
    </button>
  </div>

  <!-- Header Điều hướng nổi bật -->
  <div id="navbar-root"></div>

  <!-- Vùng nội dung chính -->
  <main id="app" class="max-w-4xl mx-auto px-4 sm:px-6 pt-28 pb-24 space-y-28"></main>

  <!-- Modal Lightbox -->
  <div id="modals-root"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
